name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Gerar um APK assinado com os Repository secrets
        type: boolean
        required: false
        default: false
      release:
        description: Publicar uma Release com o APK assinado (versão do AndroidManifest.xml)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  preview:
    if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.signed != true)) && !startsWith(github.ref, 'refs/tags/v') && inputs.release != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (build-tools e plataforma)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Compilar APK de preview sem assinatura
        run: UNSIGNED=1 bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lembra-apk-preview-unsigned
          path: build/Lembra-unsigned.apk
          if-no-files-found: error

  signed-preview:
    if: (github.event_name == 'workflow_dispatch' && inputs.signed == true && inputs.release != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[signed-apk]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (build-tools e plataforma)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Repor a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Configure KEYSTORE_BASE64 e KS_PASS em Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks

      - name: Compilar APK assinado
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lembra-apk-assinado
          path: build/Lembra.apk
          if-no-files-found: error

      - name: Remover chave temporária
        if: always()
        run: rm -f release.jks

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (build-tools e plataforma)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Testes da lógica
        run: |
          mkdir -p build/test
          javac -encoding UTF-8 -d build/test src/pt/lembra/core/*.java test/*.java
          for t in ParserTest OccTest CatTest LocTest CheckTest CallTest PauseTest; do
            java -cp build/test "$t" | tee build/test/out.txt
            grep -q "ALL PASS" build/test/out.txt
          done

      - name: Repor a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Configure KEYSTORE_BASE64 e KS_PASS em Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks

      - name: Compilar APK assinado
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lembra-apk-release
          path: build/Lembra.apk
          if-no-files-found: error

      - name: Remover chave temporária
        if: always()
        run: rm -f release.jks

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lembra-apk-release
          path: build

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          fi
          # Lembra.apk dá um link fixo para a versão mais recente: releases/latest/download/Lembra.apk
          cp build/Lembra.apk "Lembra-${TAG}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" build/Lembra.apk "Lembra-${TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/Lembra.apk "Lembra-${TAG}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lembra $TAG" \
              --latest \
              --generate-notes
          fi
